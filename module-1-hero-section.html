<style>
/* ========================================
   MODULE 1: Hero Section - Scoped Styles
   Namespace: aih- (Applied Industrial Heavyweight)
   ======================================== */

/* CSS Variables for Easy Editing */
:root {
  --aih-primary-navy: #002855;
  --aih-accent-orange: #00A3A1;
  --aih-accent-teal: #00A3A1;
  --aih-accent-yellow: #FDB515;
  --aih-text-light: #FFFFFF;
  --aih-text-dark: #1A1A1A;
  --aih-overlay-dark: rgba(0, 40, 85, 0.85);
  --aih-spacing-sm: 1rem;
  --aih-spacing-md: 2rem;
  --aih-spacing-lg: 4rem;
  --aih-border-radius: 4px;
  --aih-transition: all 0.3s ease;
}

/* Hero Container */
.aih-hero {
  position: relative;
  min-height: 650px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background-color: var(--aih-primary-navy);
  color: var(--aih-text-light);
  isolation: isolate;
}

/* Background Media (Image or Video) */
.aih-hero__background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
}

.aih-hero__background-media {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Dark Overlay with Left-to-Right Gradient */
.aih-hero__overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, rgba(0, 40, 85, 0.9), rgba(0, 40, 85, 0.6) 50%, transparent);
  z-index: -1;
}

/* Content Wrapper */
.aih-hero__content {
  max-width: 1200px;
  width: 100%;
  padding: var(--aih-spacing-lg) var(--aih-spacing-md);
  text-align: left;
  z-index: 1;
  margin-right: 8%;
}

/* Heading Styles */
.aih-hero__heading {
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  font-weight: 700;
  line-height: 1.1;
  margin: 0 0 var(--aih-spacing-md) 0;
  letter-spacing: -0.02em;
  animation: aih-fadeInUp 0.8s ease-out 0.2s both;
}

.aih-hero__subheading {
  font-size: clamp(1.125rem, 2.5vw, 1.5rem);
  font-weight: 400;
  line-height: 1.6;
  margin: 0 0 var(--aih-spacing-lg) 0;
  max-width: 800px;
  opacity: 0.95;
  animation: aih-fadeInUp 0.8s ease-out 0.4s both;
}

/* CTA Buttons */
.aih-hero__cta-group {
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem;
  justify-content: flex-start;
  align-items: center;
  animation: aih-fadeInUp 0.8s ease-out 0.6s both;
}

.aih-hero__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1rem 2.5rem;
  font-size: 1.125rem;
  font-weight: 600;
  text-decoration: none;
  border-radius: var(--aih-border-radius);
  transition: var(--aih-transition);
  border: 2px solid transparent;
  cursor: pointer;
  min-width: 200px;
  text-align: center;
}

.aih-hero__btn--primary {
  background-color: var(--aih-accent-orange);
  color: var(--aih-text-light);
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
}

.aih-hero__btn--primary:hover,
.aih-hero__btn--primary:focus {
  background-color: #E55A2A;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
}

.aih-hero__btn--secondary {
  background-color: transparent;
  color: var(--aih-text-light);
  border-color: var(--aih-text-light);
}

.aih-hero__btn--secondary:hover,
.aih-hero__btn--secondary:focus {
  background-color: rgba(255, 255, 255, 0.1);
  border-color: var(--aih-accent-yellow);
  color: var(--aih-accent-yellow);
  transform: translateY(-2px);
}

/* Focus States for Accessibility */
.aih-hero__btn:focus {
  outline: 3px solid var(--aih-accent-yellow);
  outline-offset: 4px;
}

/* Animations */
@keyframes aih-fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  .aih-hero__heading,
  .aih-hero__subheading,
  .aih-hero__cta-group {
    animation: none;
    opacity: 1;
    transform: none;
  }

  .aih-hero__btn {
    transition: none;
  }

  .aih-hero__btn:hover,
  .aih-hero__btn:focus {
    transform: none;
  }
}

/* Responsive Breakpoints */

/* Mobile (360px - 767px) */
@media (max-width: 767px) {
  .aih-hero {
    min-height: 550px;
  }

  .aih-hero__content {
    padding: var(--aih-spacing-md) var(--aih-spacing-sm);
  }

  .aih-hero__cta-group {
    flex-direction: column;
    width: 100%;
  }

  .aih-hero__btn {
    width: 100%;
    max-width: 320px;
  }
}

/* Tablet (768px - 1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .aih-hero {
    min-height: 600px;
  }
}

/* Small Desktop (1024px - 1279px) */
@media (min-width: 1024px) {
  .aih-hero {
    min-height: 650px;
  }
}

/* Large Desktop (1280px+) */
@media (min-width: 1280px) {
  .aih-hero {
    min-height: 700px;
  }

  .aih-hero__content {
    padding: var(--aih-spacing-lg) var(--aih-spacing-md);
  }
}

/* Editable Text Styling (visible in WYSIWYG) */
.editable-text {
  /* No special styling needed - just a marker class for editors */
}

</style>

<script>
/* ========================================
   MODULE 1: Hero Section - Minimal Scripts
   ======================================== */

(function() {
  'use strict';

  // Auto-play video if present (with user preference respect)
  const heroVideo = document.querySelector('.aih-hero__background-media');

  if (heroVideo && heroVideo.tagName === 'VIDEO') {
    // Ensure video is muted for autoplay to work
    heroVideo.muted = true;
    heroVideo.playsInline = true;

    // Respect reduced motion preference
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!prefersReducedMotion) {
      heroVideo.play().catch(function(error) {
        console.log('Video autoplay prevented:', error);
      });
    }
  }

  // Smooth scroll for anchor links (if CTA points to page section)
  const ctaButtons = document.querySelectorAll('.aih-hero__btn[href^="#"]');

  ctaButtons.forEach(function(button) {
    button.addEventListener('click', function(e) {
      const targetId = this.getAttribute('href');
      if (targetId && targetId !== '#') {
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          e.preventDefault();
          targetElement.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      }
    });
  });

})();
</script>
