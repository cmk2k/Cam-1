<style>
/* ========================================
   MODULE 2: Capabilities Section - Scoped Styles
   Namespace: aih- (Applied Industrial Heavyweight)
   ======================================== */

/* Section Container */
.aih-capabilities {
  background-color: #FFFFFF;
  padding: 5rem 2rem;
  position: relative;
}

.aih-capabilities__container {
  max-width: 1200px;
  margin: 0 auto;
}

/* Section Header */
.aih-capabilities__header {
  text-align: center;
  margin-bottom: 4rem;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.aih-capabilities__title {
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 1.5rem 0;
  line-height: 1.2;
}

.aih-capabilities__description {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: #4A4A4A;
  line-height: 1.7;
  margin: 0;
}

/* Image + Capabilities Grid */
.aih-capabilities__main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
  margin-bottom: 6rem;
}

/* Image Column */
.aih-capabilities__image-wrapper {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
}

.aih-capabilities__image {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  min-height: 400px;
}

/* Capabilities List Column */
.aih-capabilities__capabilities {
  padding: 2rem 0;
}

.aih-capabilities__capabilities-title {
  font-size: clamp(1.75rem, 3vw, 2.5rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 2rem 0;
  line-height: 1.3;
}

.aih-capabilities__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 1.25rem;
}

.aih-capabilities__list-item {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  font-size: 1.125rem;
  font-weight: 600;
  color: #1A1A1A;
  padding: 1.25rem;
  background: #F8F9FA;
  border-radius: 8px;
  border-left: 5px solid #00A3A1;
  transition: all 0.3s ease;
}

.aih-capabilities__list-item:hover {
  background: #FFFFFF;
  transform: translateX(8px);
  box-shadow: 0 4px 16px rgba(0, 163, 161, 0.15);
}

.aih-capabilities__list-icon {
  font-size: 1.75rem;
  color: #00A3A1;
  flex-shrink: 0;
}

/* Immersive Service Section */
.aih-capabilities__services-section {
  background: linear-gradient(135deg, #F8F9FA 0%, #E8F4F4 100%);
  padding: 5rem 3rem;
  border-radius: 16px;
  margin-top: 4rem;
  position: relative;
  overflow: hidden;
}

.aih-capabilities__services-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #00A3A1 0%, #FDB515 100%);
}

.aih-capabilities__services-header {
  text-align: center;
  margin-bottom: 4rem;
}

.aih-capabilities__services-title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 1rem 0;
  line-height: 1.2;
}

.aih-capabilities__services-subtitle {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: #4A4A4A;
  margin: 0;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.6;
}

/* Service Cards Grid */
.aih-capabilities__services-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3rem;
}

.aih-capabilities__service-card {
  background: #FFFFFF;
  border-radius: 12px;
  padding: 3rem;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.aih-capabilities__service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(90deg, #00A3A1 0%, #008C8A 100%);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.aih-capabilities__service-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 16px 48px rgba(0, 163, 161, 0.2);
}

.aih-capabilities__service-card:hover::before {
  transform: scaleX(1);
}

.aih-capabilities__service-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 2rem;
}

.aih-capabilities__service-icon {
  font-size: 3rem;
  color: #00A3A1;
}

.aih-capabilities__service-title {
  font-size: 1.75rem;
  font-weight: 700;
  color: #002855;
  margin: 0;
  line-height: 1.3;
}

.aih-capabilities__service-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 1rem;
}

.aih-capabilities__service-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  font-size: 1.0625rem;
  color: #4A4A4A;
  line-height: 1.6;
  padding-left: 0.5rem;
}

.aih-capabilities__service-item::before {
  content: '✓';
  color: #00A3A1;
  font-weight: 700;
  font-size: 1.5rem;
  flex-shrink: 0;
  line-height: 1.2;
}

/* Contact CTA Box */
.aih-capabilities__cta {
  background: linear-gradient(135deg, #00A3A1 0%, #008C8A 100%);
  color: #FFFFFF;
  padding: 3.5rem 3rem;
  border-radius: 16px;
  text-align: center;
  margin-top: 4rem;
  box-shadow: 0 12px 40px rgba(0, 163, 161, 0.25);
}

.aih-capabilities__cta-title {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 1rem 0;
}

.aih-capabilities__cta-text {
  font-size: 1.25rem;
  margin: 0 0 2rem 0;
  opacity: 0.95;
}

.aih-capabilities__cta-phone {
  font-size: 2.25rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.05em;
}

.aih-capabilities__cta-phone a {
  color: #FFFFFF;
  text-decoration: none;
  transition: opacity 0.3s ease;
  border-bottom: 2px solid rgba(255, 255, 255, 0.3);
  padding-bottom: 4px;
}

.aih-capabilities__cta-phone a:hover {
  opacity: 0.85;
  border-bottom-color: #FFFFFF;
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  .aih-capabilities__list-item:hover,
  .aih-capabilities__service-card:hover {
    transform: none;
  }

  .aih-capabilities__service-card::before {
    transition: none;
  }
}

/* Responsive Breakpoints */

/* Mobile (360px - 767px) */
@media (max-width: 767px) {
  .aih-capabilities {
    padding: 3rem 1rem;
  }

  .aih-capabilities__header {
    margin-bottom: 2.5rem;
  }

  .aih-capabilities__main-grid {
    grid-template-columns: 1fr;
    gap: 2.5rem;
    margin-bottom: 4rem;
  }

  .aih-capabilities__image-wrapper {
    order: -1;
  }

  .aih-capabilities__services-section {
    padding: 3rem 1.5rem;
  }

  .aih-capabilities__services-grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .aih-capabilities__service-card {
    padding: 2rem 1.5rem;
  }

  .aih-capabilities__cta {
    padding: 2.5rem 1.5rem;
  }

  .aih-capabilities__cta-phone {
    font-size: 1.75rem;
  }
}

/* Tablet (768px - 1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .aih-capabilities {
    padding: 4rem 2rem;
  }

  .aih-capabilities__main-grid {
    gap: 3rem;
  }

  .aih-capabilities__services-section {
    padding: 4rem 2.5rem;
  }

  .aih-capabilities__services-grid {
    gap: 2.5rem;
  }
}

/* Large Desktop (1280px+) */
@media (min-width: 1280px) {
  .aih-capabilities {
    padding: 6rem 2rem;
  }

  .aih-capabilities__main-grid {
    gap: 5rem;
  }
}

/* Editable Text Styling */
.editable-text {
  /* Marker class for HubSpot editors */
}
</style>
