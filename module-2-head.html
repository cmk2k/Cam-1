<style>
/* ========================================
   MODULE 2: Capabilities Section - Scoped Styles
   Namespace: aih- (Applied Industrial Heavyweight)
   ======================================== */

/* Info Section Container */
.aih-capabilities {
  background-color: #FFFFFF;
  padding: 5rem 2rem;
  position: relative;
}

.aih-capabilities__container {
  max-width: 1200px;
  margin: 0 auto;
}

/* Section Header */
.aih-capabilities__header {
  text-align: center;
  margin-bottom: 4rem;
}

.aih-capabilities__eyebrow {
  font-size: 0.875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #00A3A1;
  margin-bottom: 0.75rem;
  display: block;
}

.aih-capabilities__title {
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 1rem 0;
  line-height: 1.2;
}

.aih-capabilities__subtitle {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: #4A4A4A;
  max-width: 800px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Two-Column Grid */
.aih-capabilities__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: start;
  margin-bottom: 4rem;
}

/* Left Column - Capabilities List */
.aih-capabilities__list-section {
  background: #F8F9FA;
  padding: 2.5rem;
  border-radius: 8px;
  border-left: 6px solid #00A3A1;
}

.aih-capabilities__list-title {
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 1.5rem 0;
  line-height: 1.3;
}

.aih-capabilities__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 1rem;
}

.aih-capabilities__list-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 1.125rem;
  font-weight: 600;
  color: #1A1A1A;
  padding: 0.75rem;
  background: #FFFFFF;
  border-radius: 6px;
  transition: all 0.3s ease;
}

.aih-capabilities__list-item:hover {
  transform: translateX(8px);
  box-shadow: 0 4px 12px rgba(0, 163, 161, 0.15);
}

.aih-capabilities__list-icon {
  font-size: 1.5rem;
  color: #00A3A1;
  flex-shrink: 0;
}

/* Right Column - Description */
.aih-capabilities__description {
  padding: 1rem 0;
}

.aih-capabilities__description-text {
  font-size: 1.125rem;
  color: #4A4A4A;
  line-height: 1.8;
  margin-bottom: 1.5rem;
}

.aih-capabilities__description-text:last-child {
  margin-bottom: 0;
}

/* Service Cards Section */
.aih-capabilities__services {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2.5rem;
  margin-top: 4rem;
}

.aih-capabilities__service-card {
  background: #FFFFFF;
  border: 2px solid #E8E8E8;
  border-radius: 8px;
  padding: 2.5rem;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.aih-capabilities__service-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #00A3A1 0%, #FDB515 100%);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

.aih-capabilities__service-card:hover {
  border-color: #00A3A1;
  box-shadow: 0 8px 24px rgba(0, 163, 161, 0.15);
  transform: translateY(-4px);
}

.aih-capabilities__service-card:hover::before {
  transform: scaleX(1);
}

.aih-capabilities__service-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: #002855;
  margin: 0 0 1.5rem 0;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.aih-capabilities__service-icon {
  font-size: 2rem;
  color: #00A3A1;
}

.aih-capabilities__service-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.75rem;
}

.aih-capabilities__service-item {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  font-size: 1rem;
  color: #4A4A4A;
  line-height: 1.5;
}

.aih-capabilities__service-item::before {
  content: '✓';
  color: #00A3A1;
  font-weight: 700;
  font-size: 1.25rem;
  flex-shrink: 0;
}

/* Highlight Box */
.aih-capabilities__highlight {
  background: linear-gradient(135deg, #00A3A1 0%, #008C8A 100%);
  color: #FFFFFF;
  padding: 3rem 2rem;
  border-radius: 8px;
  text-align: center;
  margin-top: 4rem;
  box-shadow: 0 8px 24px rgba(0, 163, 161, 0.2);
}

.aih-capabilities__highlight-title {
  font-size: 1.75rem;
  font-weight: 700;
  margin: 0 0 1rem 0;
}

.aih-capabilities__highlight-text {
  font-size: 1.125rem;
  margin: 0 0 2rem 0;
  opacity: 0.95;
}

.aih-capabilities__highlight-phone {
  font-size: 2rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.05em;
}

.aih-capabilities__highlight-phone a {
  color: #FFFFFF;
  text-decoration: none;
  transition: opacity 0.3s ease;
}

.aih-capabilities__highlight-phone a:hover {
  opacity: 0.8;
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  .aih-capabilities__list-item:hover,
  .aih-capabilities__service-card:hover {
    transform: none;
  }

  .aih-capabilities__service-card::before {
    transition: none;
  }
}

/* Responsive Breakpoints */

/* Mobile (360px - 767px) */
@media (max-width: 767px) {
  .aih-capabilities {
    padding: 3rem 1rem;
  }

  .aih-capabilities__header {
    margin-bottom: 2.5rem;
  }

  .aih-capabilities__grid {
    grid-template-columns: 1fr;
    gap: 2.5rem;
    margin-bottom: 3rem;
  }

  .aih-capabilities__list-section {
    padding: 2rem 1.5rem;
  }

  .aih-capabilities__services {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .aih-capabilities__service-card {
    padding: 2rem 1.5rem;
  }

  .aih-capabilities__highlight {
    padding: 2rem 1.5rem;
  }

  .aih-capabilities__highlight-phone {
    font-size: 1.5rem;
  }
}

/* Tablet (768px - 1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .aih-capabilities {
    padding: 4rem 2rem;
  }

  .aih-capabilities__grid {
    gap: 3rem;
  }

  .aih-capabilities__services {
    gap: 2rem;
  }
}

/* Small Desktop (1024px - 1279px) */
@media (min-width: 1024px) {
  .aih-capabilities__services {
    gap: 2.5rem;
  }
}

/* Large Desktop (1280px+) */
@media (min-width: 1280px) {
  .aih-capabilities {
    padding: 6rem 2rem;
  }

  .aih-capabilities__grid {
    gap: 5rem;
  }
}

/* Editable Text Styling */
.editable-text {
  /* Marker class for HubSpot editors */
}
</style>
