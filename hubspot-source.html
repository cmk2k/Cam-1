<!-- HubSpot Source Code - Heavyweight Belts Landing Page -->
<!-- Insert this in the main SOURCE CODE section of your HubSpot page -->
<!-- This won't interfere with global header/footer as it's fully scoped with .ait-landing-page class -->

<div class="ait-landing-page">
  <section class="ait-hero-section">

    <!-- Glowing Card Background Image -->
    <div class="ait-glow-card">
      <div class="ait-glow-card-inner">
        <div class="ait-glow-card-image">
          <!-- REPLACE THIS WITH YOUR GLOWING PRODUCT IMAGE -->
          <!-- Upload your belt/product image to HubSpot File Manager -->
          <!-- For best results: Use a transparent PNG of your product -->
          <!-- Example: <img src="https://your-hubspot-domain.com/hubfs/belt-glow-icon.png" alt="Product Icon"> -->

          <!-- Placeholder - Replace with your logo/icon -->
          <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- "S" Shape inspired by the mockup -->
            <path d="M100 40 Q80 50, 80 70 T80 90 Q80 110, 100 120 Q120 130, 120 150 T120 170 Q120 190, 100 200"
                  stroke="#3b82f6"
                  stroke-width="12"
                  fill="none"
                  stroke-linecap="round"
                  opacity="0.9"/>
            <circle cx="100" cy="100" r="80" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
            <circle cx="100" cy="100" r="90" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="ait-hero-content">
      <!-- Optional tagline above title -->
      <p class="ait-hero-tagline">From static to unstoppable. Lead with quality, speed, and freedom built in.</p>

      <!-- Main Headline -->
      <h1 class="ait-hero-title">
        Heavyweight Belts, Meet The Future.
      </h1>

      <!-- CTA Buttons -->
      <div class="ait-hero-buttons">
        <a href="#contact" class="ait-btn ait-btn-primary">
          Get a Quote
        </a>
        <a href="#catalog" class="ait-btn ait-btn-secondary">
          Learn More
        </a>
      </div>

      <!-- Optional: Stats Section (Alternative to brands) -->
      <!-- Uncomment this if you prefer stats over brand logos -->

    <!-- Brand Logos - Rotating Marquee -->
    <div class="ait-brands-section">
      <div class="ait-brands-container">

          <!-- Brand logos - duplicate the set for seamless loop -->
