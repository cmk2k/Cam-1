<script>
// ===================================
// STICKY HEADER ON SCROLL
// ===================================

const header = document.getElementById('header');
let lastScroll = 0;

window.addEventListener('scroll', () => {
    const currentScroll = window.pageYOffset;

    // Add shadow when scrolled
    if (currentScroll > 10) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }

    lastScroll = currentScroll;
});

// ===================================
// SMOOTH SCROLLING FOR ANCHOR LINKS
// ===================================

document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();

        const targetId = this.getAttribute('href');
        if (targetId === '#') return;

        const targetElement = document.querySelector(targetId);

        if (targetElement) {
            const headerOffset = 100;
            const elementPosition = targetElement.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

            window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
            });
        }
    });
});

// ===================================
// ANIMATED COUNTER FOR STATS
// ===================================

function animateCounter(element, target, duration = 2000) {
    const start = 0;
    const increment = target / (duration / 16);
    let current = start;

    const timer = setInterval(() => {
        current += increment;
        if (current >= target) {
            element.textContent = formatStatValue(target);
            clearInterval(timer);
        } else {
            element.textContent = formatStatValue(Math.floor(current));
        }
    }, 16);
}

function formatStatValue(value) {
    if (value >= 1000) {
        return (value / 1000).toFixed(1) + 'K+';
    }
    return value.toString();
}

// ===================================
// INTERSECTION OBSERVER FOR ANIMATIONS
// ===================================

const observerOptions = {
    threshold: 0.2,
    rootMargin: '0px 0px -100px 0px'
};

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('animated');

            // Animate stat counters when they come into view
            if (entry.target.classList.contains('stat-value')) {
                const text = entry.target.textContent;
                const number = parseFloat(text.replace(/[^0-9.]/g, ''));

                if (!isNaN(number) && !entry.target.dataset.animated) {
                    entry.target.dataset.animated = 'true';
                    animateCounter(entry.target, number);
                }
            }
        }
    });
}, observerOptions);

// Observe hero stats
document.querySelectorAll('.stat-value').forEach(stat => {
    observer.observe(stat);
});

// Observe data widgets for animation
document.querySelectorAll('.data-widget').forEach(widget => {
    observer.observe(widget);
});

// ===================================
// RPM GAUGE ANIMATION
// ===================================

function animateRPM() {
    const rpmCircle = document.querySelector('.rpm-circle circle:last-child');
    if (!rpmCircle) return;

    const circumference = 2 * Math.PI * 40; // radius = 40
    const targetRPM = 3600;
    const maxRPM = 5000;
    const percentage = targetRPM / maxRPM;
    const offset = circumference * (1 - percentage);

    // Animate the stroke-dashoffset
    rpmCircle.style.strokeDashoffset = offset;
}

// Trigger RPM animation on page load
window.addEventListener('load', () => {
    setTimeout(animateRPM, 500);
});

// ===================================
// KEYBOARD ACCESSIBILITY
// ===================================

// Add keyboard navigation for dropdowns
document.querySelectorAll('.nav-item').forEach(item => {
    const link = item.querySelector('.nav-link');
    const dropdown = item.querySelector('.dropdown');

    if (dropdown) {
        link.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            }
        });

        // Close dropdown on Escape
        dropdown.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                dropdown.style.display = 'none';
                link.focus();
            }
        });
    }
});

// ===================================
// PERFORMANCE OPTIMIZATION
// ===================================

// Debounce function for scroll events
function debounce(func, wait = 10) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// Apply debounce to scroll handler for better performance
const debouncedScroll = debounce(() => {
    const currentScroll = window.pageYOffset;
    if (currentScroll > 10) {
        header.classList.add('scrolled');
    } else {
        header.classList.remove('scrolled');
    }
}, 10);

window.addEventListener('scroll', debouncedScroll);
