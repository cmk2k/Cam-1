<!-- ========================================
     MODULE 1: HERO SECTION
     Parker 5-Year Pneumatic Warranty
     Applied Industrial Technologies

     PURPOSE:
     Bold, conversion-focused hero that immediately
     communicates the 5-year warranty value proposition.

     FEATURES:
     - Full-width industrial background image
     - Overlay for text readability
     - Headline + subheadline structure
     - Dual CTA buttons with hover effects
     - Fade-in animation on load
     - Mobile responsive
     - Scoped CSS (no global conflicts)

     HUBSPOT INSTRUCTIONS:
     1. Add a "Custom HTML" module to your page
     2. Paste this entire code block
     3. Replace 'placeholder-hero-pneumatic-warehouse.jpg'
        with your actual image URL from HubSpot File Manager
     4. Update CTA button links:
        - "Talk to an Expert" href="#contact-form"
        - "Learn More" href="#learn-more"
     5. Test on mobile/tablet

     ======================================== -->

<section class="applied-hero-parker" style="
  position: relative;
  width: 100%;
  min-height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url('placeholder-hero-pneumatic-warehouse.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  padding: 80px 20px;
  overflow: hidden;
  animation: appliedHeroFadeIn 1s ease-out;
">

  <!-- Dark Overlay for Text Readability -->
  <div style="
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(27, 15, 58, 0.35) 0%, rgba(0, 118, 128, 0.25) 100%);
    z-index: 1;
  "></div>

  <!-- Hero Content Container -->
  <div class="applied-hero-content" style="
    position: relative;
    z-index: 2;
    max-width: 1200px;
    width: 100%;
    text-align: left;
    color: #ffffff;
    padding: 0 40px;
  ">

    <!-- Eyebrow Label -->
    <p style="
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #FDB81E;
      margin: 0 0 16px 0;
      animation: appliedHeroSlideUp 1s ease-out 0.2s backwards;
    ">Genuine Parker Parts</p>

    <!-- Main Headline -->
    <h1 style="
      font-size: 48px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      margin: 0 0 24px 0;
      animation: appliedHeroSlideUp 1s ease-out 0.3s backwards;
    ">5-Year Pneumatic System Warranty</h1>

    <!-- Subheadline -->
    <p style="
      font-size: 20px;
      font-weight: 400;
      line-height: 1.6;
      color: #ffffff;
      margin: 0 0 40px 0;
      max-width: 700px;
      animation: appliedHeroSlideUp 1s ease-out 0.4s backwards;
    ">Best-in-class protection for your pneumatic components. Reduce downtime, protect assets, and lower total cost of ownership with Parker's industry-leading extended warranty.</p>

    <!-- CTA Buttons Container -->
    <div style="
      display: flex;
      gap: 16px;
      justify-content: flex-start;
      flex-wrap: wrap;
      animation: appliedHeroSlideUp 1s ease-out 0.5s backwards;
    ">

      <!-- Primary CTA Button: Talk to an Expert -->
      <a href="#contact-form" class="applied-hero-cta-primary" style="
        display: inline-block;
        background-color: #007680;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        padding: 16px 40px;
        border-radius: 4px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(0, 118, 128, 0.3);
      "
      onmouseover="this.style.backgroundColor='#005f68'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(0, 118, 128, 0.4)';"
      onmouseout="this.style.backgroundColor='#007680'; this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(0, 118, 128, 0.3)';">
        Talk to an Expert
      </a>

      <!-- Secondary CTA Button: Learn More -->
      <a href="#learn-more" class="applied-hero-cta-secondary" style="
        display: inline-block;
        background-color: transparent;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        padding: 16px 40px;
        border-radius: 4px;
        border: 2px solid #ffffff;
        transition: all 0.3s ease;
      "
      onmouseover="this.style.backgroundColor='rgba(255, 255, 255, 0.1)'; this.style.transform='translateY(-2px)';"
      onmouseout="this.style.backgroundColor='transparent'; this.style.transform='translateY(0)';">
        Learn More
      </a>

    </div>

  </div>

</section>
