<script>
  // ========================================
  // Smooth Scroll for Anchor Links
  // ========================================
  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
      const href = this.getAttribute('href');

      // Don't prevent default for links that just have "#"
      if (href === '#' || href === '') return;

      e.preventDefault();
      const target = document.querySelector(href);

      if (target) {
        target.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
      }
    });
  });

  // ========================================
  // Scroll Animation Trigger (Optional)
  // Triggers animations when elements come into view
  // ========================================
  const observerOptions = {
    threshold: 0.1,
    rootMargin: '0px 0px -50px 0px'
  };

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
      }
    });
  }, observerOptions);

  // Observe all elements with class 'applied-animate-on-scroll'
  document.querySelectorAll('.applied-animate-on-scroll').forEach(el => {
    observer.observe(el);
  });

  // ========================================
  // Console Log - Remove in Production
  // ========================================
  console.log('Parker Pneumatic Warranty Landing Page - Applied Industrial Technologies');
  console.log('Version: 1.0');

</script>
