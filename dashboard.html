<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 30px;
            gap: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #252525;
            border-radius: 12px;
            border: 2px solid #333;
            gap: 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .rate-legend {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .legend-color.hitting {
            background: #00ff88;
        }

        .legend-color.warning {
            background: #ffcc00;
        }

        .legend-color.below {
            background: #ff4444;
        }

        .legend-text {
            color: #ccc;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .current-time {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .last-updated {
            font-size: 1.4rem;
            color: #999;
        }

        .last-updated-time {
            color: #00ff88;
            font-weight: 700;
        }

        .data-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            overflow-y: auto;
        }

        .station-card {
            background: #252525;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .station-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: #00ff88;
        }

        .station-card.below::before {
            background: #ff4444;
        }

        .station-card.warning::before {
            background: #ffcc00;
        }

        .station-card.hitting::before {
            background: #00ff88;
        }

        .station-name {
            font-size: 3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .station-metrics {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .metric-label {
            font-size: 1.8rem;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .metric-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
        }

        .metric-value.jph {
            color: #00ff88;
        }

        .upload-section {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #252525;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        .upload-section.hidden {
            display: none;
        }

        .upload-icon {
            font-size: 5rem;
            color: #00d4ff;
        }

        .upload-title {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-button {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #1a1a1a;
            border: none;
            padding: 18px 40px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .file-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.5);
        }

        .file-name {
            font-size: 1.2rem;
            color: #00ff88;
            text-align: center;
        }

        .upload-status {
            font-size: 1.2rem;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
        }

        .upload-status.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .upload-status.error {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            font-size: 2rem;
            color: #666;
        }

        .reload-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #252525;
            border: 2px solid #333;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 900;
        }

        .reload-button:hover {
            background: #333;
            transform: rotate(180deg);
        }

        .reload-button svg {
            width: 35px;
            height: 35px;
            fill: #00d4ff;
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="header-left">
                <h1>OPERATIONS DASHBOARD</h1>
                <div class="rate-legend">
                    <div class="legend-item">
                        <div class="legend-color hitting"></div>
                        <div class="legend-text">200+</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color warning"></div>
                        <div class="legend-text">170-199</div>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color below"></div>
                        <div class="legend-text">Under 170</div>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="current-time" id="currentTime"></div>
                <div class="last-updated">Last Updated: <span class="last-updated-time" id="lastUpdate">Never</span></div>
            </div>
        </div>

        <div class="data-grid" id="dataGrid">
            <div class="no-data">Upload an Excel file to view station data</div>
        </div>
    </div>

    <!-- Upload Section -->
    <div class="upload-section" id="uploadSection">
        <div class="upload-icon">📊</div>
        <div class="upload-title">Upload Excel File</div>
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
            <button class="file-button" onclick="document.getElementById('fileInput').click()">Choose File</button>
        </div>
        <div class="file-name" id="fileName"></div>
        <div class="upload-status" id="uploadStatus" style="display: none;"></div>
    </div>

    <!-- Reload Button -->
    <div class="reload-button" id="reloadButton" style="display: none;" onclick="showUploadSection()">
        <svg viewBox="0 0 24 24">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let currentData = [];

        // Update clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            document.getElementById('currentTime').textContent = timeString;
        }

        // Update last update timestamp
        function updateLastUpdate() {
            const now = new Date();
            const dateTimeString = now.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            document.getElementById('lastUpdate').textContent = dateTimeString;
        }

        // Show upload section
        function showUploadSection() {
            document.getElementById('uploadSection').classList.remove('hidden');
        }

        // Hide upload section
        function hideUploadSection() {
            document.getElementById('uploadSection').classList.add('hidden');
            document.getElementById('reloadButton').style.display = 'flex';
        }

        // File upload handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const fileNameEl = document.getElementById('fileName');
            const statusEl = document.getElementById('uploadStatus');

            if (file) {
                fileNameEl.textContent = file.name;

                // Validate file type
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
                    processExcelFile(file);
                } else {
                    statusEl.textContent = 'Invalid file type. Please upload Excel or CSV file.';
                    statusEl.className = 'upload-status error';
                    statusEl.style.display = 'block';
                    setTimeout(() => {
                        statusEl.style.display = 'none';
                    }, 3000);
                }
            }
        });

        // Process Excel file
        async function processExcelFile(file) {
            const statusEl = document.getElementById('uploadStatus');

            try {
                statusEl.textContent = 'Processing...';
                statusEl.className = 'upload-status';
                statusEl.style.display = 'block';

                const data = await readExcelFile(file);

                if (data && data.length > 0) {
                    currentData = data;
                    renderDashboard(data);
                    updateLastUpdate();

                    statusEl.textContent = 'Upload successful!';
                    statusEl.className = 'upload-status success';

                    setTimeout(() => {
                        statusEl.style.display = 'none';
                        hideUploadSection();
                    }, 1500);
                } else {
                    throw new Error('No data found in file');
                }

            } catch (error) {
                console.error('Upload error:', error);
                statusEl.textContent = 'Upload failed. Please check file format.';
                statusEl.className = 'upload-status error';

                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }

        // Read Excel file
        function readExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        // Parse the data
                        const parsedData = jsonData.map(row => {
                            const jph = parseInt(row.JPH || row.jph || 0);
                            return {
                                station: row.Station || row.station || '',
                                jph: jph,
                                status: determineStatus(jph)
                            };
                        }).filter(item => item.station); // Filter out empty rows

                        resolve(parsedData);
                    } catch (error) {
                        reject(error);
                    }
                };

                reader.onerror = function(error) {
                    reject(error);
                };

                reader.readAsArrayBuffer(file);
            });
        }

        // Determine status from JPH value
        function determineStatus(jph) {
            if (jph >= 200) {
                return 'hitting';
            } else if (jph >= 170) {
                return 'warning';
            } else {
                return 'below';
            }
        }

        // Render dashboard
        function renderDashboard(data) {
            const gridEl = document.getElementById('dataGrid');
            gridEl.innerHTML = '';

            if (data.length === 0) {
                gridEl.innerHTML = '<div class="no-data">No station data found in file</div>';
                return;
            }

            data.forEach(station => {
                const card = document.createElement('div');
                card.className = `station-card ${station.status}`;

                card.innerHTML = `
                    <div class="station-name">${station.station}</div>
                    <div class="station-metrics">
                        <div class="metric">
                            <div class="metric-label">JPH</div>
                            <div class="metric-value jph">${station.jph.toLocaleString()}</div>
                        </div>
                    </div>
                `;

                gridEl.appendChild(card);
            });
        }

        // Initialize
        function init() {
            updateClock();
            setInterval(updateClock, 1000);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
