<style>
/* ========================================
   MODULE 2: Capabilities Section - Scoped Styles
   Namespace: aih- (Applied Industrial Heavyweight)
   ======================================== */

/* Section Container */
.aih-capabilities {
  background-color: #FFFFFF;
  padding: 5rem 2rem;
  position: relative;
}

.aih-capabilities__container {
  max-width: 1600px;
  margin: 0 auto;
}

/* Section Header */
.aih-capabilities__header {
  text-align: center;
  margin-bottom: 4rem;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.aih-capabilities__title {
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 1.5rem 0;
  line-height: 1.2;
}

.aih-capabilities__description {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: #4A4A4A;
  line-height: 1.7;
  margin: 0;
}

/* Image + Capabilities Grid */
.aih-capabilities__main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
  margin-bottom: 3rem;
}

/* Image Column */
.aih-capabilities__image-wrapper {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
}

.aih-capabilities__image {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  min-height: 400px;
}

/* Capabilities List Column */
.aih-capabilities__capabilities {
  padding: 2rem 0;
}

.aih-capabilities__capabilities-title {
  font-size: clamp(1.75rem, 3vw, 2.5rem);
  font-weight: 700;
  color: #002855;
  margin: 0 0 2rem 0;
  line-height: 1.3;
}

.aih-capabilities__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 1.25rem;
}

.aih-capabilities__list-item {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  font-size: 1.125rem;
  font-weight: 600;
  color: #1A1A1A;
  padding: 1.25rem;
  background: #F8F9FA;
  border-radius: 8px;
  border-left: 5px solid #00A3A1;
  transition: all 0.3s ease;
}

.aih-capabilities__list-item:hover {
  background: #FFFFFF;
  transform: translateX(8px);
  box-shadow: 0 4px 16px rgba(0, 163, 161, 0.15);
}

.aih-capabilities__list-icon {
  font-size: 1.75rem;
  color: #00A3A1;
  flex-shrink: 0;
}

/* Field Service Card - Full Width Below */
.aih-capabilities__field-service {
  background: linear-gradient(135deg, #F8F9FA 0%, #E8F4F4 100%);
  padding: 3.5rem 3rem;
  border-radius: 16px;
  margin-top: 2rem;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 163, 161, 0.1);
}

.aih-capabilities__field-service::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #00A3A1 0%, #FDB515 100%);
}

.aih-capabilities__field-header {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 2.5rem;
}

.aih-capabilities__field-icon {
  font-size: 3.5rem;
  color: #00A3A1;
  flex-shrink: 0;
}

.aih-capabilities__field-title {
  font-size: clamp(1.75rem, 3vw, 2.5rem);
  font-weight: 700;
  color: #002855;
  margin: 0;
  line-height: 1.3;
}

.aih-capabilities__field-subtitle {
  font-size: 1.125rem;
  color: #4A4A4A;
  line-height: 1.7;
  margin-bottom: 2rem;
  max-width: 900px;
}

/* Field Service List - 2 Column Layout */
.aih-capabilities__field-list {
  list-style: none;
  margin: 0 0 2rem 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.25rem;
}

.aih-capabilities__field-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 1.0625rem;
  font-weight: 600;
  color: #1A1A1A;
  padding: 1rem 1.5rem;
  background: #FFFFFF;
  border-radius: 8px;
  border-left: 4px solid #00A3A1;
  transition: all 0.3s ease;
}

.aih-capabilities__field-item:hover {
  transform: translateX(6px);
  box-shadow: 0 4px 12px rgba(0, 163, 161, 0.15);
}

.aih-capabilities__field-item::before {
  content: '✓';
  color: #00A3A1;
  font-weight: 700;
  font-size: 1.5rem;
  flex-shrink: 0;
  line-height: 1;
}

/* Emergency Service Highlight */
.aih-capabilities__field-highlight {
  background: linear-gradient(135deg, #00A3A1 0%, #008C8A 100%);
  color: #FFFFFF;
  padding: 2rem 2.5rem;
  border-radius: 12px;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 2rem;
  box-shadow: 0 8px 24px rgba(0, 163, 161, 0.25);
}

/* CTA Button */
.aih-capabilities__field-cta {
  text-align: center;
}

.aih-capabilities__cta-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 1.25rem 3rem;
  font-size: 1.25rem;
  font-weight: 700;
  text-decoration: none;
  color: #FFFFFF;
  background: linear-gradient(135deg, #00A3A1 0%, #008C8A 100%);
  border-radius: 8px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 16px rgba(0, 163, 161, 0.3);
}

.aih-capabilities__cta-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0, 163, 161, 0.4);
}

.aih-capabilities__cta-button:focus {
  outline: 3px solid #FDB515;
  outline-offset: 4px;
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  .aih-capabilities__list-item:hover,
  .aih-capabilities__field-item:hover,
  .aih-capabilities__cta-button:hover {
    transform: none;
  }
}

/* Responsive Breakpoints */

/* Mobile (360px - 767px) */
@media (max-width: 767px) {
  .aih-capabilities {
    padding: 3rem 1rem;
  }

  .aih-capabilities__header {
    margin-bottom: 2.5rem;
  }

  .aih-capabilities__main-grid {
    grid-template-columns: 1fr;
    gap: 2.5rem;
    margin-bottom: 2rem;
  }

  .aih-capabilities__image-wrapper {
    order: -1;
  }

  .aih-capabilities__field-service {
    padding: 2.5rem 1.5rem;
  }

  .aih-capabilities__field-header {
    flex-direction: column;
    text-align: center;
    gap: 1rem;
  }

  .aih-capabilities__field-list {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .aih-capabilities__field-highlight {
    padding: 1.5rem;
    font-size: 1.25rem;
  }

  .aih-capabilities__cta-button {
    width: 100%;
    max-width: 320px;
  }
}

/* Tablet (768px - 1023px) */
@media (min-width: 768px) and (max-width: 1023px) {
  .aih-capabilities {
    padding: 4rem 2rem;
  }

  .aih-capabilities__main-grid {
    gap: 3rem;
  }

  .aih-capabilities__field-service {
    padding: 3rem 2.5rem;
  }
}

/* Large Desktop (1280px+) */
@media (min-width: 1280px) {
  .aih-capabilities {
    padding: 6rem 2rem;
  }

  .aih-capabilities__main-grid {
    gap: 5rem;
  }
}

/* Editable Text Styling */
.editable-text {
  /* Marker class for HubSpot editors */
}
</style>
