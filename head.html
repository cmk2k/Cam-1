       ======================================== -->
  <style>
    /* ========================================
       CSS RESET FOR LANDING PAGE MODULES ONLY
       ======================================== */
    .applied-landing-page * {
      box-sizing: border-box;
    }

    /* ========================================
       BRAND COLORS - Applied Industrial
       ======================================== */
    :root {
      --applied-teal: #007680;
      --applied-teal-dark: #005f68;
      --applied-navy: #1B0F3A;
      --applied-yellow: #FDB81E;
      --applied-yellow-dark: #e5a71a;
      --applied-white: #ffffff;
      --applied-gray-light: #f5f5f5;
      --applied-gray: #666666;
      --applied-black: #000000;
    }

    /* ========================================
       TYPOGRAPHY UTILITIES
       ======================================== */
    .applied-landing-page {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
    }

    /* ========================================
       GLOBAL ANIMATIONS
       Reusable across all modules
       ======================================== */

    /* Fade in from opacity 0 to 1 */
    @keyframes appliedFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Slide up with fade */
    @keyframes appliedSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Slide down with fade */
    @keyframes appliedSlideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Slide in from left */
    @keyframes appliedSlideLeft {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Slide in from right */
    @keyframes appliedSlideRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Scale up from smaller size */
    @keyframes appliedScaleUp {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ========================================
       HERO MODULE ANIMATIONS
       ======================================== */
    @keyframes appliedHeroFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes appliedHeroSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================================
       VIDEO BACKGROUND STYLES
       ======================================== */
    .applied-hero-video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Hide video on mobile to save bandwidth */
    @media (max-width: 768px) {
      .applied-hero-video-bg {
        display: none;
      }
    }

    /* ========================================
       UTILITY CLASSES
       ======================================== */
    .applied-section-padding {
