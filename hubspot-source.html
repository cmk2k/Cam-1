<!-- HubSpot Source Code - Heavyweight Belts Landing Page -->
<!-- Insert this in the main SOURCE CODE section of your HubSpot page -->
<!-- This won't interfere with global header/footer as it's fully scoped with .ait-landing-page class -->

<div class="ait-landing-page">
  <section class="ait-hero-section">
    <div class="ait-hero-container">
      <!-- Left Side: Content -->
      <div class="ait-hero-content">
        <h1 class="ait-hero-title">
          Heavyweight<br>
          Industrial<br>
          Belts
        </h1>
        <p class="ait-hero-subtitle">
          Premium power transmission solutions engineered for maximum durability and performance. Trusted by leading manufacturers worldwide.
        </p>
        <div class="ait-hero-buttons">
          <a href="#contact" class="ait-btn ait-btn-primary">
            <svg class="ait-btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Get a Quote
          </a>
          <a href="#catalog" class="ait-btn ait-btn-secondary">
            Explore Catalog
          </a>
        </div>
      </div>

      <!-- Right Side: Image -->
      <div class="ait-hero-image">
        <div class="ait-belt-card">
          <div class="ait-belt-image">
            <!-- Belt Icon/Image Placeholder -->
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 80%; height: 80%; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));">
              <!-- Belt Pulley Design -->
              <circle cx="100" cy="100" r="80" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
              <circle cx="100" cy="100" r="65" stroke="rgba(239,68,68,0.8)" stroke-width="12" fill="none" stroke-dasharray="8 4"/>
              <circle cx="100" cy="100" r="50" fill="url(#belt-gradient)"/>

              <!-- Center Hub -->
              <circle cx="100" cy="100" r="25" fill="rgba(30,58,138,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

              <!-- Spokes -->
              <line x1="100" y1="75" x2="100" y2="50" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>
              <line x1="125" y1="100" x2="150" y2="100" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>
              <line x1="100" y1="125" x2="100" y2="150" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>
              <line x1="75" y1="100" x2="50" y2="100" stroke="rgba(255,255,255,0.7)" stroke-width="4" stroke-linecap="round"/>

              <!-- Belt Texture Lines -->
              <g opacity="0.4">
                <path d="M 30 100 Q 50 80, 70 100 T 110 100 T 150 100 T 170 100" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
                <path d="M 30 105 Q 50 85, 70 105 T 110 105 T 150 105 T 170 105" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
              </g>

              <defs>
                <radialGradient id="belt-gradient" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" style="stop-color:rgba(239,68,68,0.6);stop-opacity:1" />
                  <stop offset="100%" style="stop-color:rgba(30,58,138,0.9);stop-opacity:1" />
                </radialGradient>
              </defs>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="ait-stats-section">
      <div class="ait-stats-container">
        <div class="ait-stats-grid">
          <div class="ait-stat-item">
            <div class="ait-stat-label">Belt Systems Installed</div>
            <div class="ait-stat-value">125,000</div>
          </div>
          <div class="ait-stat-item">
            <div class="ait-stat-label">Industries Served</div>
            <div class="ait-stat-value">2,500</div>
          </div>
          <div class="ait-stat-item">
            <div class="ait-stat-label">Operational Uptime</div>
            <div class="ait-stat-value">99.7%</div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
